<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17243d"><title>WONS DIARY 꿈해몽 검색</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#17243d;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif}.wrap{max-width:820px;margin:auto;padding:18px 14px 55px}header{background:linear-gradient(135deg,#17243d,#394d82);color:white;padding:27px 20px;border-radius:18px;text-align:center}h1{font-size:clamp(23px,5vw,32px);margin:0 0 8px}header p{margin:0;color:#d8e0f5}.search{background:white;padding:18px;border-radius:15px;margin:15px 0;box-shadow:0 4px 18px #17243d0b}input{width:100%;font:inherit;font-size:17px;padding:14px;border:2px solid #ccd4e3;border-radius:11px}input:focus{outline:2px solid #6489d9}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}button{cursor:pointer;border:1px solid #d8dfeb;border-radius:9px;background:#f4f6fb;padding:9px 13px;font:inherit;color:#1c3154}button:hover,button:focus-visible{background:#e5ebf9}#count{font-size:14px;color:#53627b;margin:12px 2px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{display:block;text-decoration:none;color:#17243d;background:white;text-align:left;padding:16px;border-radius:13px;border:1px solid #e1e6ef;min-height:100px}.item b{display:block;font-size:17px;margin-bottom:6px}.item:hover,.item:focus-visible{background:#eef3ff;border-color:#8aa5e4}.item span{font-size:13px;color:#61718b}.result-card{background:white;border-radius:13px;border:1px solid #e1e6ef;overflow:hidden}.result-card .item{width:100%;border:0;border-radius:0;min-height:75px}.direct-link{display:block;padding:11px 16px;border-top:1px solid #e1e6ef;background:#f1f5ff;font-size:14px;font-weight:700;text-decoration:none;color:#244c9a}.direct-link:hover,.direct-link:focus-visible{background:#dfe9ff;text-decoration:underline}#postLink a{display:block;background:#244c9a;color:white;border-radius:10px;text-decoration:none;text-align:center;font-weight:700;padding:15px;margin:22px 0}#postLink a:hover{background:#173774}.detail{background:white;padding:22px;border-radius:15px;margin-top:15px;border:1px solid #e1e6ef}.detail h2{margin:8px 0 15px}.detail h3{font-size:17px;margin-top:22px}.detail p{line-height:1.8}.tag{color:#536ca7;font-size:13px;font-weight:700}.notice{color:#64748b;font-size:13px;line-height:1.7}.related{display:flex;gap:8px;flex-wrap:wrap}a{color:#345cb1}.credit{display:block;text-align:right;margin-top:26px;font-size:12px}.hidden{display:none}#back{margin-bottom:5px}@media(max-width:490px){.grid{grid-template-columns:1fr}.wrap{padding:10px 10px 48px}.result-card .item{min-height:65px}.detail{padding:17px}}</style></head><body><main class="wrap"><header><h1>🌙 꿈해몽 검색</h1><p>꿈에 나온 단어를 검색하고 전통적 상징과 심리적 의미를 살펴보세요</p></header><section class="search" id="searchArea"><label for="q"><strong>어떤 꿈을 꾸셨나요?</strong></label><input id="q" type="search" placeholder="예: 뱀, 돈, 조상, 이빨" autocomplete="off"><div class="chips" id="chips"></div></section><div id="listing"><p id="count" aria-live="polite"></p><div class="grid" id="results"></div></div><article class="detail hidden" id="detail"><button id="back">← 목록으로</button><div class="tag" id="category"></div><h2 id="dreamTitle"></h2><h3>전통적인 꿈해몽</h3><p id="traditional"></p><h3>심리적으로 살펴보기</h3><p id="psychology"></p><h3>관련 꿈</h3><div class="related" id="related"></div><p class="notice">꿈해몽은 민속적 상징 해석과 심리적 성찰을 위한 참고 정보입니다. 실제 미래의 사건이나 건강 상태를 예측하지 않습니다.</p><div id="postLink"></div></article><a class="credit" href="https://www.wonsdiary.com/" target="_blank" rel="noopener noreferrer">https://www.wonsdiary.com/</a></main><script>
const raw=[
['뱀','동물','변화와 재물, 경계의 상징으로 풀이되며 물리거나 쫓기는 상황에 따라 의미가 달라집니다.','두려움이나 강한 변화에 대한 감정이 나타났을 수 있습니다.','독사 뱀에게 물리는 꿈'],
['돼지','동물','풍요와 재물의 상징으로 알려져 있으며 돼지가 들어오거나 떠나는 장면에 따라 풀이가 달라집니다.','풍요에 대한 기대 또는 생활의 만족감을 반영할 수 있습니다.','돼지 새끼돼지'],
['개','동물','충성, 우정, 보호의 상징으로 풀이되며 공격적인 개는 갈등의 상징이 되기도 합니다.','친밀한 관계에서 느끼는 신뢰나 긴장을 돌아볼 수 있습니다.','강아지 개에게 물리는 꿈'],
['고양이','동물','독립성, 직감, 경계의 상징으로 해석하는 전통이 있습니다.','자율성과 대인관계에서의 미묘한 감정이 나타날 수 있습니다.','새끼고양이 검은고양이'],
['호랑이','동물','권위와 용맹, 큰 도전의 상징으로 풀이됩니다.','압도적인 대상이나 목표를 마주한 마음일 수 있습니다.','백호 호랑이에게 쫓기는 꿈'],
['이빨','신체','이빨이 빠지는 꿈은 상실과 변화에 관한 민속 해석이 많지만 상황마다 다릅니다.','외모, 건강 또는 통제력에 대한 걱정이 반영될 수 있습니다.','치아 앞니 어금니'],
['머리카락','신체','머리카락이 자라거나 잘리는 장면을 활력과 변화의 상징으로 풀이합니다.','자기 이미지와 변화에 대한 생각을 반영할 수 있습니다.','머리 자르는 꿈 탈모'],
['피','신체','피는 생명력과 강한 감정의 상징이며 다친 장면과 회복 장면을 구별해 풀이합니다.','긴장이나 최근의 강렬한 경험이 나타날 수 있습니다.','피 흘리는 꿈'],
['임신','가족·인물','새로운 시작과 결실을 기다리는 상징으로 풀이되기도 합니다.','새로운 계획과 책임에 대한 기대 또는 부담을 반영할 수 있습니다.','임신한 꿈 태몽'],
['출산','가족·인물','성과와 새로운 국면을 맞는 상징으로 풀이합니다.','오래 준비한 일이 마무리되거나 시작되는 느낌일 수 있습니다.','아기 낳는 꿈'],
['돌아가신 부모님','가족·인물','가족의 보호와 그리움, 조언을 상징하는 꿈으로 전해집니다.','애도, 기억, 가족에 대한 애착이 꿈에 나타날 수 있습니다.','돌아가신 아버지 돌아가신 어머니'],
['조상','가족·인물','조상의 방문이나 선물을 전통적으로 보호와 인연의 상징으로 풀이합니다.','가족의 가치관과 과거의 기억을 떠올리는 과정일 수 있습니다.','할머니 할아버지 조상님'],
['아기','가족·인물','새로운 가능성과 보살핌이 필요한 일을 상징합니다.','책임감, 보호 본능 또는 새로운 계획을 나타낼 수 있습니다.','갓난아기 신생아'],
['친구','가족·인물','친구와의 만남과 다툼을 관계 변화의 상징으로 풀이합니다.','실제 우정이나 사회적 소속감에 대한 감정이 드러날 수 있습니다.','친구 만나는 꿈'],
['연인','가족·인물','만남과 이별의 장면을 애정과 관계의 상징으로 풀이합니다.','친밀감, 불안, 기대 같은 관계 감정이 나타날 수 있습니다.','남자친구 여자친구 애인'],
['돈','재물','돈을 받거나 줍는 꿈은 재물과 기회의 상징으로 알려져 있습니다.','경제적 안정이나 선택에 대한 관심이 반영될 수 있습니다.','지폐 동전 돈 줍는 꿈'],
['금','재물','금은 귀중한 가치와 성취의 상징으로 풀이됩니다.','중요하게 여기는 목표나 인정받고 싶은 마음이 나타날 수 있습니다.','금괴 금목걸이 황금'],
['반지','재물','반지는 약속과 인연, 소중한 관계의 상징으로 풀이됩니다.','관계에서의 헌신이나 소속감을 떠올릴 수 있습니다.','금반지 결혼반지'],
['지갑','재물','지갑을 찾거나 잃는 장면은 재물 관리와 소유의 상징으로 풀이합니다.','자원과 개인적 안전에 대한 생각을 반영할 수 있습니다.','지갑 잃어버리는 꿈'],
['복권','재물','복권 당첨은 행운에 대한 기대의 상징으로 해석되기도 합니다.','예상 밖의 기회에 대한 희망이 나타날 수 있습니다. 실제 당첨을 예고하지 않습니다.','로또 당첨 꿈'],
['불','자연','활활 타는 불은 기세와 변화의 상징이며 피해 상황은 별도로 살핍니다.','열정이나 분노, 급격한 변화에 대한 감정일 수 있습니다.','화재 불나는 꿈'],
['물','자연','맑은 물과 탁한 물은 전통적으로 서로 다른 상징으로 풀이됩니다.','감정의 흐름이나 안정감과 관련된 이미지일 수 있습니다.','맑은물 물에 빠지는 꿈'],
['바다','자연','넓은 바다는 가능성과 미지의 영역을 상징하는 경우가 많습니다.','자유에 대한 기대나 불확실성에 대한 감정일 수 있습니다.','파도 바닷물'],
['비','자연','비는 정화와 변화, 때로는 슬픔의 상징으로 풀이됩니다.','쌓인 감정을 해소하는 이미지로 볼 수도 있습니다.','소나기 비맞는 꿈'],
['홍수','자연','큰물은 급격한 변화나 감당하기 어려운 상황의 상징으로 풀이됩니다.','감정이나 과제가 밀려드는 느낌을 반영할 수 있습니다.','물난리 침수'],
['집','장소·이동','집은 생활 기반과 가족, 안정의 상징으로 풀이됩니다.','자신의 내면이나 익숙한 환경에 대한 감정일 수 있습니다.','집 무너지는 꿈 이사'],
['자동차','장소·이동','운전과 이동은 삶의 방향과 진행을 상징하는 경우가 많습니다.','목표를 통제하는 느낌이나 진로에 대한 생각일 수 있습니다.','교통사고 운전'],
['비행기','장소·이동','비행과 여행은 도약과 이동, 새로운 기회를 상징합니다.','큰 목표나 낯선 변화에 대한 기대와 불안이 반영될 수 있습니다.','비행기 추락 비행'],
['추락','장소·이동','높은 곳에서 떨어지는 꿈은 불안과 변화의 상징으로 풀이됩니다.','통제력 상실이나 스트레스와 관련된 느낌일 수 있습니다.','떨어지는 꿈 낭떠러지'],
['시험','장소·이동','시험을 치르는 꿈은 평가와 도전의 상징으로 풀이됩니다.','성과 압박이나 준비 상태에 대한 걱정이 나타날 수 있습니다.','시험 떨어지는 꿈 수능']
];
const postSlugs=["snake", "pig", "dog", "cat", "tiger", "teeth-falling-out", "hair", "blood", "pregnancy", "childbirth", "deceased-parents", "ancestor", "baby", "friend", "lover", "money", "gold", "ring", "wallet", "lottery", "fire", "water", "sea", "rain", "flood", "house", "car", "airplane", "falling", "exam"];
const dreams=raw.map((r,i)=>({id:i+1,title:r[0]+' 꿈해몽',category:r[1],traditional:r[2],psychology:r[3],aliases:r[4],url:postSlugs[i]?'https://www.wonsdiary.com/2026/11/'+postSlugs[i]+'-dream-meaning.html':''}));
const $=id=>document.getElementById(id), q=$('q');
function showList(){ $('detail').classList.add('hidden');$('listing').classList.remove('hidden');$('searchArea').classList.remove('hidden');render();}
function render(){const term=q.value.trim().replace(/꿈해몽|꿈풀이|해몽/g,'').trim();const filtered=dreams.filter(d=>(d.title+' '+d.category+' '+d.aliases).includes(term));$('count').textContent=`검색 결과 ${filtered.length}개 · 대표 꿈 30개`;const el=$('results');el.replaceChildren();filtered.forEach(d=>{const a=document.createElement('a');a.className='item';a.href=d.url;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label',d.title+' 블로그 게시글 바로가기');const strong=document.createElement('b');strong.textContent=d.title;const span=document.createElement('span');span.textContent=d.category+' · 블로그에서 꿈해몽 20가지 바로 보기 ↗';a.append(strong,span);el.append(a);});}
function showDetail(id){const d=dreams.find(x=>x.id===id);if(!d)return;$('listing').classList.add('hidden');$('searchArea').classList.add('hidden');$('detail').classList.remove('hidden');$('category').textContent=d.category;$('dreamTitle').textContent=d.title;$('traditional').textContent=d.traditional;$('psychology').textContent=d.psychology;const rel=$('related');rel.replaceChildren();dreams.filter(x=>x.category===d.category&&x.id!==d.id).slice(0,4).forEach(x=>{const b=document.createElement('button');b.textContent=x.title;b.addEventListener('click',()=>showDetail(x.id));rel.append(b);});const link=$('postLink');link.replaceChildren();if(d.url){const a=document.createElement('a');a.href=d.url;a.textContent='전체 꿈해몽 20가지 자세히 보기 →';a.target='_blank';a.rel='noopener noreferrer';link.append(a);}else{const p=document.createElement('p');p.className='notice';p.textContent='시험 꿈해몽 상세 게시글은 발행 주소 확인 후 연결됩니다.';link.append(p);}window.scrollTo({top:0,behavior:'smooth'});}
$('back').addEventListener('click',showList);q.addEventListener('input',render);['뱀','돼지','돈','이빨','조상','불'].forEach(word=>{const b=document.createElement('button');b.textContent=word;b.addEventListener('click',()=>{q.value=word;render();q.focus();});$('chips').append(b);});render();
</script></body></html>
